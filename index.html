<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVENT HORIZON — Black Hole Explorer</title>
<style>
  :root { color-scheme: dark; --purple:#b66cff; --cyan:#79e6ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#03020a; color:#f6efff; font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif; }
  #scene { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  .panel {
    position:fixed; top:18px; left:18px; width:min(330px, calc(100vw - 36px));
    max-height:calc(100vh - 36px); overflow:auto; padding:18px;
    background:linear-gradient(145deg,rgba(20,12,37,.88),rgba(5,6,20,.82));
    border:1px solid rgba(190,130,255,.32); border-radius:18px;
    box-shadow:0 10px 50px rgba(0,0,0,.35); backdrop-filter:blur(16px);
  }
  .eyebrow { color:#c79cff; font-size:10px; letter-spacing:.22em; font-weight:800; }
  h1 { font-size:24px; line-height:1.05; margin:8px 0; letter-spacing:-.04em; }
  .subtitle { font-size:12px; color:#c2b8d5; line-height:1.5; margin:0 0 17px; }
  .control { margin:15px 0; }
  .control-head { display:flex; justify-content:space-between; gap:12px; align-items:center; font-size:12px; margin-bottom:7px; }
  output { color:#d7b5ff; font-variant-numeric:tabular-nums; min-width:42px; text-align:right; }
  input[type=range] { width:100%; accent-color:#bd78ff; cursor:pointer; }
  .buttons { display:flex; gap:8px; margin-top:17px; }
  button { border:1px solid rgba(201,153,255,.45); border-radius:10px; padding:10px 13px; color:white; background:rgba(166,89,255,.18); cursor:pointer; font-weight:700; }
  button:hover { background:rgba(166,89,255,.34); }
  button.primary { background:linear-gradient(110deg,#8c45e8,#5932b7); border-color:transparent; flex:1; }
  .legend { display:flex; gap:7px; align-items:center; margin-top:15px; font-size:10px; color:#b7abc9; }
  .dot { width:7px; height:7px; border-radius:50%; background:#bd75ff; box-shadow:0 0 10px #bd75ff; }
  .hint { position:fixed; bottom:17px; right:18px; color:#d8c9ee; font-size:11px; background:rgba(8,5,18,.62); padding:9px 12px; border:1px solid rgba(190,130,255,.2); border-radius:10px; }
  .status { position:fixed; top:18px; right:18px; font-size:10px; letter-spacing:.14em; color:#d8baff; background:rgba(8,5,18,.55); border:1px solid rgba(190,130,255,.22); padding:9px 11px; border-radius:20px; }
  @media (max-width:600px) { .panel { top:10px; left:10px; width:min(290px,calc(100vw - 20px)); max-height:calc(100vh - 20px); padding:14px; } h1{font-size:21px} .control{margin:11px 0} .hint{bottom:10px;right:10px;font-size:10px} .status{top:10px;right:10px} }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="scene"></div>
<div class="panel">
  <div class="eyebrow">INTERACTIVE ASTROPHYSICS VISUALIZER</div>
  <h1>EVENT HORIZON</h1>
  <p class="subtitle">Explore a stylized black hole. Adjust the camera, tilt the glowing disk, and watch the particles orbit.</p>
  <div class="control">
    <div class="control-head"><label for="elev">Camera elevation</label><output id="elevVal">18°</output></div>
    <input id="elev" type="range" min="-5" max="80" value="18">
  </div>
  <div class="control">
    <div class="control-head"><label for="azim">Camera azimuth</label><output id="azimVal">-55°</output></div>
    <input id="azim" type="range" min="-180" max="180" value="-55">
  </div>
  <div class="control">
    <div class="control-head"><label for="zoom">Zoom</label><output id="zoomVal">8.0×</output></div>
    <input id="zoom" type="range" min="4" max="16" value="8" step=".1">
  </div>
  <div class="control">
    <div class="control-head"><label for="tilt">Disk tilt</label><output id="tiltVal">58°</output></div>
    <input id="tilt" type="range" min="0" max="85" value="58">
  </div>
  <div class="control">
    <div class="control-head"><label for="speed">Particle speed</label><output id="speedVal">1.0×</output></div>
    <input id="speed" type="range" min="0" max="3" value="1" step=".1">
  </div>
  <div class="buttons">
    <button id="play" class="primary">❚❚ Pause animation</button>
    <button id="reset">Reset view</button>
  </div>
  <div class="legend"><span class="dot"></span> Purple accretion disk <span style="opacity:.5">•</span> Artistic visualization, not a GR simulation</div>
</div>
<div class="status">● LIVE SCENE</div>
<div class="hint">Drag to rotate · Scroll to zoom</div>
<script type="module">
import * as THREE from 'three';

const mount = document.getElementById('scene');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03020a);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
mount.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x9a76cc, 0.6));
const pointLight = new THREE.PointLight(0xb66cff, 5, 24); pointLight.position.set(0,0,0); scene.add(pointLight);

const root = new THREE.Group(); scene.add(root);
const disk = new THREE.Group(); root.add(disk);
const holeGroup = new THREE.Group(); root.add(holeGroup);

function glowTexture() {
  const c = document.createElement('canvas'); c.width=c.height=128;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.12,'rgba(225,185,255,.9)');
  g.addColorStop(.32,'rgba(171,89,255,.42)'); g.addColorStop(1,'rgba(120,40,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
  const tex=new THREE.CanvasTexture(c); return tex;
}
const glowMap=glowTexture();

function makeGlow(radius, opacity, scale=1) {
  const mat=new THREE.SpriteMaterial({map:glowMap,color:0xa85cff,transparent:true,opacity,depthWrite:false,blending:THREE.AdditiveBlending});
  const s=new THREE.Sprite(mat); s.scale.set(radius*scale,radius*scale,1); s.position.set(0,0,0); holeGroup.add(s); return s;
}
makeGlow(6.8,.24); makeGlow(4.5,.30); makeGlow(2.8,.42);

// Black event-horizon sphere
const blackHole = new THREE.Mesh(new THREE.SphereGeometry(0.78,64,48), new THREE.MeshBasicMaterial({color:0x000000}));
holeGroup.add(blackHole);
// Bright thin photon-like ring
const ring = new THREE.Mesh(new THREE.TorusGeometry(.91,.025,12,160), new THREE.MeshBasicMaterial({color:0xe2c4ff}));
holeGroup.add(ring);
const ringGlow = new THREE.Mesh(new THREE.TorusGeometry(1.02,.075,12,160), new THREE.MeshBasicMaterial({color:0x9e45ff,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false}));
holeGroup.add(ringGlow);

// Thin layered rings give the disk a bright, luminous edge.
for(let i=0;i<14;i++){
  const r=1.12+i*.105;
  const mat=new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(.76-i*.009,.95,.68-i*.018),transparent:true,opacity:.12+(1-i/18)*.24,blending:THREE.AdditiveBlending,depthWrite:false});
  const torus=new THREE.Mesh(new THREE.TorusGeometry(r,.018+(i<4?.012:0),6,180),mat);
  disk.add(torus);
}
// A cloud of tiny colored orbiting particles in the disk plane.
const count=5200;
const positions=new Float32Array(count*3), colors=new Float32Array(count*3), sizes=new Float32Array(count);
const radii=new Float32Array(count), angles=new Float32Array(count), rates=new Float32Array(count);
const colorInner=new THREE.Color(0xf2d8ff), colorMid=new THREE.Color(0xc16aff), colorOuter=new THREE.Color(0x5420c8);
for(let i=0;i<count;i++){
  const r=1.12+Math.pow(Math.random(),.82)*3.45;
  radii[i]=r; angles[i]=Math.random()*Math.PI*2; rates[i]=(.12+1.15/Math.sqrt(r))*((Math.random()<.5)?1:-1)*(.7+Math.random()*.6);
  const t=(r-1.12)/3.45; const col=t<.35?colorInner.clone().lerp(colorMid,t/.35):colorMid.clone().lerp(colorOuter,(t-.35)/.65);
  colors[i*3]=col.r; colors[i*3+1]=col.g; colors[i*3+2]=col.b;
  sizes[i]=Math.random();
}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
const particleMat=new THREE.PointsMaterial({size:.035,vertexColors:true,transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true,map:glowMap});
const particleCloud=new THREE.Points(geo,particleMat); disk.add(particleCloud);

// Spiral arms made from glowing points
const armCount=1900, armPos=new Float32Array(armCount*3), armCol=new Float32Array(armCount*3);
for(let i=0;i<armCount;i++){
  const t=i/armCount, arm=i%2, r=1.25+t*3.25, a=t* Math.PI*5.5+arm*Math.PI;
  armPos[i*3]=Math.cos(a)*r; armPos[i*3+1]=Math.sin(a)*r; armPos[i*3+2]=(Math.random()-.5)*.055;
  const c=new THREE.Color().setHSL(.77-t*.055,.9,.6-t*.18);
  armCol[i*3]=c.r;armCol[i*3+1]=c.g;armCol[i*3+2]=c.b;
}
const armGeo=new THREE.BufferGeometry();armGeo.setAttribute('position',new THREE.BufferAttribute(armPos,3));armGeo.setAttribute('color',new THREE.BufferAttribute(armCol,3));
disk.add(new THREE.Points(armGeo,new THREE.PointsMaterial({size:.025,vertexColors:true,transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending,map:glowMap})));

// Star field
const starCount=2200, starPos=new Float32Array(starCount*3), starColors=new Float32Array(starCount*3);
for(let i=0;i<starCount;i++){
  const r=18+Math.random()*65, theta=Math.random()*Math.PI*2, z=(Math.random()-.5)*70;
  starPos[i*3]=Math.cos(theta)*r; starPos[i*3+1]=Math.sin(theta)*r; starPos[i*3+2]=z;
  const c=new THREE.Color().setHSL(.62+Math.random()*.2,.25+Math.random()*.4,.45+Math.random()*.5);
  starColors[i*3]=c.r;starColors[i*3+1]=c.g;starColors[i*3+2]=c.b;
}
const starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));starGeo.setAttribute('color',new THREE.BufferAttribute(starColors,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({size:.085,vertexColors:true,transparent:true,opacity:.85,sizeAttenuation:true})));

// Slider-controlled camera orbit
let elev=18, azim=-55, zoom=8, tilt=58, speed=1, playing=true;
let drag=false, lastX=0, lastY=0;
function setCamera(){
  const e=THREE.MathUtils.degToRad(elev), a=THREE.MathUtils.degToRad(azim);
  camera.position.set(zoom*Math.cos(e)*Math.cos(a),zoom*Math.cos(e)*Math.sin(a),zoom*Math.sin(e));
  camera.lookAt(0,0,0);
}
function setTilt(){
  disk.rotation.set(THREE.MathUtils.degToRad(tilt),0,0);
  holeGroup.rotation.set(THREE.MathUtils.degToRad(tilt),0,0);
}
setCamera();setTilt();

const controls=[
  ['elev',v=>{elev=+v;document.getElementById('elevVal').textContent=v+'°';setCamera();}],
  ['azim',v=>{azim=+v;document.getElementById('azimVal').textContent=v+'°';setCamera();}],
  ['zoom',v=>{zoom=+v;document.getElementById('zoomVal').textContent=(+v).toFixed(1)+'×';setCamera();}],
  ['tilt',v=>{tilt=+v;document.getElementById('tiltVal').textContent=v+'°';setTilt();}],
  ['speed',v=>{speed=+v;document.getElementById('speedVal').textContent=(+v).toFixed(1)+'×';}]
];
for(const [id,fn] of controls) document.getElementById(id).addEventListener('input',e=>fn(e.target.value));
document.getElementById('play').addEventListener('click',()=>{
  playing=!playing; document.getElementById('play').textContent=playing?'❚❚ Pause animation':'▶ Resume animation';
});
document.getElementById('reset').addEventListener('click',()=>{
  elev=18;azim=-55;zoom=8;tilt=58;speed=1;
  for(const [id,fn] of controls){const el=document.getElementById(id);el.value=({elev,azim,zoom,tilt,speed})[id];fn(el.value);}
});
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{
  if(!drag)return;
  azim-=(e.clientX-lastX)*.35; elev+=(e.clientY-lastY)*.25;
  elev=THREE.MathUtils.clamp(elev,-5,80);
  lastX=e.clientX;lastY=e.clientY;
  document.getElementById('azim').value=azim;document.getElementById('azimVal').textContent=Math.round(azim)+'°';
  document.getElementById('elev').value=elev;document.getElementById('elevVal').textContent=Math.round(elev)+'°';setCamera();
});
renderer.domElement.addEventListener('pointerup',()=>drag=false);
renderer.domElement.addEventListener('pointercancel',()=>drag=false);
renderer.domElement.addEventListener('wheel',e=>{
  zoom=THREE.MathUtils.clamp(zoom+e.deltaY*.008,4,16);
  document.getElementById('zoom').value=zoom;document.getElementById('zoomVal').textContent=zoom.toFixed(1)+'×';setCamera();
},{passive:true});

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  if(playing){
    for(let i=0;i<count;i++){
      angles[i]+=rates[i]*speed*dt;
      const r=radii[i], a=angles[i];
      positions[i*3]=Math.cos(a)*r;
      positions[i*3+1]=Math.sin(a)*r;
      positions[i*3+2]=Math.sin(a*2+i)*.025;
    }
    geo.attributes.position.needsUpdate=true;
    disk.rotation.z+=dt*speed*.025;
    ring.rotation.z-=dt*speed*.08;
  }
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
